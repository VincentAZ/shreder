<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d4452"/>
      <stop offset="1" stop-color="#1e222a"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2f3a"/>
      <stop offset="1" stop-color="#14171d"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6e9ef"/>
    </linearGradient>
    <linearGradient id="strip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f4f8"/>
      <stop offset="1" stop-color="#c9ced8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a4e" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ff3b30"/>
      <stop offset="1" stop-color="#ff5a4e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- paper going in -->
  <g transform="rotate(-4 64 40)">
    <rect x="35" y="8" width="58" height="56" rx="4" fill="url(#paper)" stroke="#b8bfcc" stroke-width="1"/>
    <rect x="43" y="17" width="30" height="4" rx="2" fill="#99a1b3"/>
    <rect x="43" y="26" width="42" height="3" rx="1.5" fill="#c3c9d5"/>
    <rect x="43" y="33" width="38" height="3" rx="1.5" fill="#c3c9d5"/>
    <rect x="43" y="40" width="42" height="3" rx="1.5" fill="#c3c9d5"/>
    <rect x="43" y="47" width="26" height="3" rx="1.5" fill="#c3c9d5"/>
  </g>
  <!-- strips coming out -->
  <g>
    <path d="M27 90 h7 v24 q0 3 -3.5 4 q-3.5 -1 -3.5 -4z" fill="url(#strip)"/>
    <path d="M38 90 h7 v29 q0 3 -3.5 4 q-3.5 -1 -3.5 -4z" fill="url(#strip)"/>
    <path d="M49 90 h7 v20 q0 3 -3.5 4 q-3.5 -1 -3.5 -4z" fill="url(#strip)"/>
    <path d="M60 90 h7 v27 q0 3 -3.5 4 q-3.5 -1 -3.5 -4z" fill="url(#strip)"/>
    <path d="M71 90 h7 v22 q0 3 -3.5 4 q-3.5 -1 -3.5 -4z" fill="url(#strip)"/>
    <path d="M82 90 h7 v28 q0 3 -3.5 4 q-3.5 -1 -3.5 -4z" fill="url(#strip)"/>
    <path d="M93 90 h7 v18 q0 3 -3.5 4 q-3.5 -1 -3.5 -4z" fill="url(#strip)"/>
    <g fill="#a6adbb">
      <rect x="29" y="96" width="3" height="2" rx="1"/><rect x="40" y="101" width="3" height="2" rx="1"/>
      <rect x="51" y="95" width="3" height="2" rx="1"/><rect x="62" y="104" width="3" height="2" rx="1"/>
      <rect x="73" y="98" width="3" height="2" rx="1"/><rect x="84" y="107" width="3" height="2" rx="1"/>
      <rect x="95" y="97" width="3" height="2" rx="1"/>
    </g>
  </g>
  <!-- shredder body -->
  <rect x="12" y="52" width="104" height="42" rx="10" fill="url(#body)"/>
  <rect x="12" y="66" width="104" height="28" rx="10" fill="url(#front)"/>
  <rect x="12" y="66" width="104" height="10" fill="url(#front)"/>
  <rect x="24" y="58" width="80" height="5" rx="2.5" fill="#0b0d11"/>
  <rect x="24" y="58.5" width="80" height="2" rx="1" fill="url(#glow)" opacity=".9"/>
  <rect x="22" y="76" width="54" height="4" rx="2" fill="#3b4250"/>
  <circle cx="98" cy="79" r="5" fill="#2ec27e"/>
  <circle cx="98" cy="79" r="2.4" fill="#8ff0a4"/>
  <rect x="12" y="52" width="104" height="42" rx="10" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="1.5"/>
</svg>
